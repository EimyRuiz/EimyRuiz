    @keyframes sube{from{opacity:0;transform:translateY(18px)}}
    .li{transform-origin:752.18px 0;animation:ab 1s cubic-bezier(.2,.8,.2,1) .2s backwards}
    @keyframes ab{from{transform:scaleX(0)}}
    .pas{stroke-dasharray:102;animation:traza 1s ease-out backwards}
    .traza{stroke-dasharray:102;animation:traza 2s ease-in-out .3s backwards}
    @keyframes traza{from{stroke-dashoffset:102}}
    .flota{animation:flota 4.6s ease-in-out infinite alternate}
    @keyframes flota{from{transform:translateY(7px)}to{transform:translateY(-8px)}}
    .p{transform-origin:625px 300px;animation:pend 7s ease-in-out infinite alternate}
    @keyframes pend{from{transform:rotate(-58deg)}to{transform:rotate(58deg)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
